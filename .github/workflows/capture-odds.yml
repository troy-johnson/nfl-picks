name: Capture NFL odds

on:
  workflow_dispatch:
  schedule:
    # Off-minute slots in Eastern time. GitHub drops or delays crons that
    # sit on :00/:30 (high-load minutes). Each slot lands inside the
    # 45-180 min pre-kickoff window for every 2026 kickoff time
    # (09:30, 13:00, 15:00, 17:00, 20:00, 20:15, 20:35 ET).
    # The scripts are idempotent, so a slot outside a window is a no-op.
    - cron: "47 7,10,11,13,15,17,18 * 8-12,1-2 *"
      timezone: "America/New_York"
    # Backup slot in case the primary run is dropped.
    - cron: "17 8,11,12,14,15,18,19 * 8-12,1-2 *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Capture game-day odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "THE_ODDS_API_KEY is not set; skipping capture"
            exit 0
          fi
          uv run --project model python model/predict.py --capture-odds
      - name: Capture ESPN pick shares
        run: uv run --project model python model/crowd.py --capture
      - name: Commit snapshots
        run: |
          if [ -z "$(git status --porcelain -- data/odds-snapshots data/crowd-picks)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds-snapshots data/crowd-picks
          git commit -m "data: capture NFL odds and pick shares"
          git push
