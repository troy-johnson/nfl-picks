name: Capture NFL odds

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * 8-12,1-2 *"

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Capture game-day odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "THE_ODDS_API_KEY is not set; skipping capture"
            exit 0
          fi
          uv run --project model python model/predict.py --capture-odds
      - name: Commit odds snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/odds-snapshots)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds-snapshots
          git commit -m "data: capture NFL odds"
          git push
