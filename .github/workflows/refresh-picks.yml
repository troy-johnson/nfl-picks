name: Refresh NFL picks
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Allow refresh after the week's first kickoff"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "model/**"
      - ".github/workflows/refresh-picks.yml"
  schedule:
    # Off-minute slots in Eastern time. GitHub drops or delays crons that
    # sit on :00/:30 (high-load minutes). preflight() exits early when no
    # refresh stage is due, so slots outside a window are no-ops.
    # Wednesday "initial" stage (10:00-18:00 ET).
    - cron: "52 11 * 9-12,1 3"
      timezone: "America/New_York"
    # "final" stage: 45-180 min before the first kickoff of a game day.
    # Covers every 2026 kickoff time (09:30, 13:00, 15:00, 17:00, 20:00, 20:15, 20:35 ET).
    - cron: "52 7,10,11,13,15,17,18 * 9-12,1 *"
      timezone: "America/New_York"
    # Backup slot in case the primary run is dropped.
    - cron: "22 8,11,12,14,15,18,19 * 9-12,1 *"
      timezone: "America/New_York"
permissions:
  contents: write
concurrency:
  group: publish-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Generate current week
        run: uv run --project model python model/predict.py ${{ inputs.force && '--force' || '' }}
      - name: Commit updated picks
        run: |
          if git diff --quiet -- public/data && [ -z "$(git status --porcelain -- data/crowd-picks)" ]; then echo "No pick changes to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/crowd-picks
          git commit -m "data: refresh NFL picks"
          # Another run can land a commit between checkout and push.
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
