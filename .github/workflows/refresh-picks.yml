name: Refresh NFL picks
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Allow refresh after the week's first kickoff"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 16 * 9-12,1 0,3-6"
    - cron: "0 23 * 9-12,1 0,3-6"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Generate current week
        run: uv run --project model python model/predict.py ${{ inputs.force && '--force' || '' }}
      - name: Commit updated picks
        run: |
          if git diff --quiet -- public/data; then echo "No pick changes to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: refresh NFL picks"
          git push
